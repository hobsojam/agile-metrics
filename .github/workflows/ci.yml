name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        # `uv sync` builds this package (and rebuilds it on later `uv run`
        # invocations below) via the plain `setuptools.build_meta` backend
        # declared in pyproject.toml. There is no custom setup.py hook, so
        # this only packages our own source tree - it does not execute
        # arbitrary or third-party code. Safe to let it build.
        run: uv sync --extra dev
      - name: Lint and format check
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy src
      - name: Tests
        run: uv run pytest
      - name: Dependency audit
        run: uv run pip-audit
      - name: Security lint
        run: uv run bandit -c pyproject.toml -r src/

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # Every `uv run` step below operates on this same local project, built
    # with the plain `setuptools.build_meta` backend declared in
    # pyproject.toml (no custom setup.py hook) - so if any step triggers a
    # rebuild of *our* package, it only packages our own source tree.
    # `uv sync` below also installs third-party dependencies; those are a
    # separate, ordinary trust boundary (same as any dependency install),
    # covered by the Dependabot config and the pip-audit/bandit steps
    # further down, not by this note. In practice only this first `uv sync`
    # performs a build at all - later `uv run` calls just verify the venv
    # still matches pyproject.toml/uv.lock (unchanged mid-job) and skip it.
    #
    # Deliberately NOT passing --no-build (forbid building any dependency
    # from a source distribution): verified against our committed uv.lock
    # that every dependency already resolves to a wheel on linux/py3.11, so
    # it would change nothing today. But it would make CI brittle to a
    # routine Dependabot bump - if some future dependency version ships
    # without a wheel for this platform, --no-build hard-fails CI instead of
    # building from source, for reasons unrelated to our code. The specific
    # risk it guards against (a malicious build-backend hook running at
    # install time, as opposed to the installed package's own code, which
    # runs either way) is already covered by the Dependabot cooldown,
    # pip-audit, and the pinned lockfile - so the reliability cost isn't
    # worth it here.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install dependencies
        # --locked asserts uv.lock exactly matches pyproject.toml and fails
        # loudly instead of silently re-resolving to different (unreviewed)
        # versions if they ever drift - every step below also passes it.
        run: uv sync --extra dev --locked
      - name: Lint and format check
        run: uv run --locked ruff check . && uv run --locked ruff format --check .
      - name: Type check
        run: uv run --locked mypy src scripts
      - name: Tests
        run: uv run --locked pytest
      - name: Dependency audit
        run: uv run --locked pip-audit
      - name: Security lint
        run: uv run --locked bandit -c pyproject.toml -r src/
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        # --ignore-scripts: none of our dependencies need install-time
        # lifecycle scripts (verified locally), so skip them rather than
        # letting a compromised package run arbitrary code at install time.
        run: npm ci --ignore-scripts
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Frontend type check
        working-directory: frontend
        run: npm run typecheck
      - name: Frontend tests
        working-directory: frontend
        run: npm test
      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit
      - name: Verify generated API types are current
        # Constitution v1.3.0: generated files are committed, not built
        # fresh every time - this fails if regenerating them (from the
        # backend's current OpenAPI schema) would change what's committed,
        # the same "pinned artifact, gate its freshness" pattern as uv.lock.
        working-directory: frontend
        run: |
          npm run generate-types
          git diff --exit-code -- openapi.json src/api-types.ts
      - name: Docker build and smoke test
        # Builds the container image (spec 002 FR-007/FR-008) and runs it
        # with the same input as quickstart.md Scenario 1, asserting the
        # same output a local run produces - catches the container form
        # silently drifting from the local CLI's behavior.
        run: |
          docker build -t agile-metrics .
          OUTPUT=$(docker run --rm agile-metrics --history "3,5,4,6,2,5,4,3" --period-days 7 --backlog-size 20 --seed 42)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "50% confidence:"
          echo "$OUTPUT" | grep -q "95% confidence:"

sonar.projectKey=hobsojam_agile-metrics
sonar.organization=hobsojam

sonar.sources=src,frontend/src
sonar.tests=tests,frontend/src
sonar.test.inclusions=tests/**,frontend/src/**/*.test.tsx,frontend/src/**/*.test.ts

# Generated files are never hand-edited (openapi-typescript regenerates
# api-types.ts from the backend's own OpenAPI schema on every run - see
# research.md "Keeping frontend and backend types in sync") - renaming
# identifiers in it, or fixing any other finding inside it, would just be
# overwritten by the next `npm run generate-types`.
sonar.exclusions=frontend/src/api-types.ts,frontend/dist/**,frontend/node_modules/**

sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=frontend/coverage/lcov.info
